    <tspan x="60" dy="0">Core Web</tspan><tspan x="60" dy="46">Vitals Mistakes</tspan>
  </text>

  <!-- Icon circle -->
  <circle cx="820" cy="260" r="44" fill="#FED7AA" fill-opacity="0.12"/>
  <text x="820" y="275" text-anchor="middle" font-size="36">⚡</text>

  <!-- Bottom accent line -->
  <rect x="60" y="290" width="80" height="3" rx="2" fill="#FED7AA" fill-opacity="0.6"/>
  <rect x="152" y="290" width="40" height="3" rx="2" fill="#FED7AA" fill-opacity="0.3"/>
  <rect x="204" y="290" width="20" height="3" rx="2" fill="#FED7AA" fill-opacity="0.15"/>
