<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <rect width="900" height="320" fill="url(#stripe)"/>

  <!-- Decorative shapes -->
  
        <circle cx="780" cy="60" r="140" fill="#5EEAD4" fill-opacity="0.08"/>
        <circle cx="680" cy="240" r="80" fill="#5EEAD4" fill-opacity="0.06"/>
        <rect x="60" y="180" width="60" height="60" rx="12" fill="#5EEAD4" fill-opacity="0.07" transform="rotate(20 90 210)"/>
        <circle cx="100" cy="260" r="30" fill="#5EEAD4" fill-opacity="0.05"/>
        <line x1="600" y1="0" x2="900" y2="320" stroke="#5EEAD4" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Dot grid -->
  <g fill="#5EEAD4" fill-opacity="0.12">
    <circle cx="700" cy="60" r="2"/><circle cx="730" cy="60" r="2"/><circle cx="760" cy="60" r="2"/><circle cx="790" cy="60" r="2"/><circle cx="820" cy="60" r="2"/><circle cx="700" cy="90" r="2"/><circle cx="730" cy="90" r="2"/><circle cx="760" cy="90" r="2"/><circle cx="790" cy="90" r="2"/><circle cx="820" cy="90" r="2"/><circle cx="700" cy="120" r="2"/><circle cx="730" cy="120" r="2"/><circle cx="760" cy="120" r="2"/><circle cx="790" cy="120" r="2"/><circle cx="820" cy="120" r="2"/><circle cx="700" cy="150" r="2"/><circle cx="730" cy="150" r="2"/><circle cx="760" cy="150" r="2"/><circle cx="790" cy="150" r="2"/><circle cx="820" cy="150" r="2"/><circle cx="700" cy="180" r="2"/><circle cx="730" cy="180" r="2"/><circle cx="760" cy="180" r="2"/><circle cx="790" cy="180" r="2"/><circle cx="820" cy="180" r="2"/>
  </g>

  <!-- Category label -->
  <rect x="60" y="50" height="26" rx="5" fill="#5EEAD4" fill-opacity="0.15"
    width="144"/>
  <text x="72" y="68" font-family="system-ui,-apple-system,sans-serif"
    font-size="11" font-weight="800" letter-spacing="0.1em"
    fill="#5EEAD4">AI & AUTOMATION</text>

  <!-- Title -->
  <text x="60" y="158" font-family="Georgia,'Times New Roman',serif"
    font-size="42" font-weight="700" fill="#FFFFFF" line-height="1.15">
    <tspan x="60" dy="0">Content</tspan><tspan x="60" dy="46">Freshness</tspan><tspan x="60" dy="46">Monitor</tspan>
  </text>

  <!-- Icon circle -->
  <circle cx="820" cy="260" r="44" fill="#5EEAD4" fill-opacity="0.12"/>
  <text x="820" y="275" text-anchor="middle" font-size="36">🤖</text>

  <!-- Bottom accent line -->
  <rect x="60" y="290" width="80" height="3" rx="2" fill="#5EEAD4" fill-opacity="0.6"/>
  <rect x="152" y="290" width="40" height="3" rx="2" fill="#5EEAD4" fill-opacity="0.3"/>
  <rect x="204" y="290" width="20" height="3" rx="2" fill="#5EEAD4" fill-opacity="0.15"/>
</svg>